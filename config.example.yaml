# IronMind — Urge Interrupt Configuration
# Copy to config.yaml and adjust to your preferences.
# All fields are optional. Defaults are shown.

# ─────────────────────────────────────────
# GOAL
# ─────────────────────────────────────────

# "reduction" = cutting back
# "cessation" = stopping completely
goal_type: cessation

# Optional: streak start date (ISO 8601)
# streak_start: "2025-01-15"

# ─────────────────────────────────────────
# LANGUAGE
# ─────────────────────────────────────────

# en | zh | es | fr | de
language: en

# ─────────────────────────────────────────
# REMINDERS
# ─────────────────────────────────────────

# morning | evening | both | off
reminder_schedule: both

reminder_morning_time: "08:00"
reminder_evening_time: "21:00"

# Tone of reminder messages
# supportive | direct | clinical
reminder_tone: direct

# ─────────────────────────────────────────
# INTERVENTION
# ─────────────────────────────────────────

# How forceful the active_urge response is
# low | medium | high
intervention_intensity: medium

# Max words in active_urge responses (keep low — long responses fail under pressure)
active_urge_max_words: 40

# ─────────────────────────────────────────
# INTERRUPTION ACTIONS
# ─────────────────────────────────────────

# Preferred replacement behaviors (surfaced first in active_urge and warning)
# Options: pushups | cold_water | walk | breathe | move_room |
#          go_public | write_one_sentence | text_someone | call_someone |
#          read_book | watch_something | play_game
default_interruption_actions:
  - cold_water
  - pushups
  - move_room
  - walk

# ─────────────────────────────────────────
# TRACKING
# ─────────────────────────────────────────

streak_tracking: true
relapse_logging: true

# Confirm before logging a relapse (prevents accidental logging)
relapse_log_confirm: true

# auto | manual (whether streak resets automatically after relapse)
streak_reset_mode: manual

# ─────────────────────────────────────────
# TRIGGER MAPPING
# ─────────────────────────────────────────

trigger_map_enabled: true

# Auto-generate pattern card after trigger map session
auto_generate_trigger_card: true

# How long to wait after relapse before offering trigger debrief
# immediate | 1h | 24h | never
relapse_debrief_delay: "24h"

# ─────────────────────────────────────────
# KNOWN TRIGGERS (user-defined)
# ─────────────────────────────────────────

# Pre-load known patterns for personalized warnings
known_triggers:
  times:
    - "22:00-01:00"
  situations:
    - alone_at_home
    - phone_in_bed
    - extended_scrolling
  emotional_states:
    - bored
    - stressed
    - lonely
    - anxious

# ─────────────────────────────────────────
# POST-RELAPSE
# ─────────────────────────────────────────

# Show spiral-prevention message immediately after relapse report
spiral_prevention_prompt: true
