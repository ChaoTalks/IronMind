# IronMind — Urge Interrupt Configuration
# Copy to config.yaml and adjust to your preferences.
# All fields are optional. Defaults are shown.

# ─────────────────────────────────────────
# GOAL
# ─────────────────────────────────────────

# "reduction" = cutting back
# "cessation" = stopping completely
goal_type: cessation

# Optional: streak start date (ISO 8601)
# streak_start: "2025-01-15"

# ─────────────────────────────────────────
# LANGUAGE
# ─────────────────────────────────────────

# en | zh | es | fr | de
language: en

# ─────────────────────────────────────────
# REMINDERS
# ─────────────────────────────────────────

# morning | evening | both | off
reminder_schedule: both

reminder_morning_time: "08:00"
reminder_evening_time: "21:00"

# Tone of reminder messages
# supportive | direct | clinical
reminder_tone: direct

# ─────────────────────────────────────────
# INTERVENTION
# ─────────────────────────────────────────

# How forceful the active_urge response is
# low | medium | high
intervention_intensity: medium

# Max words in active_urge responses (keep low — long responses fail under pressure)
active_urge_max_words: 40

# ─────────────────────────────────────────
# INTERRUPTION ACTIONS
# ─────────────────────────────────────────

# Preferred replacement behaviors (surfaced first in active_urge and warning)
# Options: pushups | cold_water | walk | breathe | move_room |
#          go_public | write_one_sentence | text_someone | call_someone |
#          read_book | watch_something | play_game
default_interruption_actions:
  - cold_water
  - pushups
  - move_room
  - walk

# ─────────────────────────────────────────
# TRACKING
# ─────────────────────────────────────────

streak_tracking: true
relapse_logging: true

# Confirm before logging a relapse (prevents accidental logging)
relapse_log_confirm: true

# auto | manual (whether streak resets automatically after relapse)
streak_reset_mode: manual

# ─────────────────────────────────────────
# TRIGGER MAPPING
# ─────────────────────────────────────────

trigger_map_enabled: true

# Auto-generate pattern card after trigger map session
auto_generate_trigger_card: true

# How long to wait after relapse before offering trigger debrief
# immediate | 1h | 24h | never
relapse_debrief_delay: "24h"

# ─────────────────────────────────────────
# KNOWN TRIGGERS (user-defined)
# ─────────────────────────────────────────

# Pre-load known patterns for personalized warnings
known_triggers:
  times:
    - "22:00-01:00"
  situations:
    - alone_at_home
    - phone_in_bed
    - extended_scrolling
  emotional_states:
    - bored
    - stressed
    - lonely
    - anxious

# ─────────────────────────────────────────
# POST-RELAPSE
# ─────────────────────────────────────────

# Show spiral-prevention message immediately after relapse report
spiral_prevention_prompt: true

# ─────────────────────────────────────────
# IQ CHALLENGE
# ─────────────────────────────────────────

challenge:

  # Master switch for IQ challenges
  enabled: true

  # Topics to draw challenges from (any combination)
  # leetcode | history | math | entertainment
  topics:
    - math
    - leetcode

  # Difficulty level for challenges
  # easy | medium | hard | mixed (cycles easy→medium→hard→medium→...)
  difficulty: mixed

  # Send a challenge during active_urge (after the physical command)
  in_active_urge: true

  # Send a challenge during warning (as the primary redirect)
  in_warning: true

# ─────────────────────────────────────────
# IRONBUDDY — PROACTIVE COMPANION
# ─────────────────────────────────────────

ironbuddy:

  # Master switch for all proactive notifications
  enabled: true

  # Delivery channel for scheduled notifications
  # openclaw | system | both
  delivery: openclaw

  # ── Scheduled notifications ──────────────

  # Enable/disable the cron-based schedule entirely
  schedule: true

  # Morning check-in time (24h, local time)
  morning_time: "08:00"

  # Evening wind-down time (24h, local time)
  evening_time: "21:30"

  # Minutes before a known high-risk window to send pre-window alert
  alert_before_window: 30

  # ── Session-start hook ───────────────────

  # Inject a check-in at the start of a new session
  session_check: true

  # Minimum hours since last check-in before session hook fires
  session_check_gap: 20

  # Inject a mid-session alert when the user enters a high-risk window
  mid_session_alerts: true

  # ── Tone ─────────────────────────────────

  # Inherits global reminder_tone unless overridden here
  # supportive | direct | clinical
  # tone: direct

  # ── Streak milestones ────────────────────

  # Send milestone messages on days: 3, 7, 14, 21, 30, 60, 90, +30...
  milestones: true

  # ── Silence alarm ────────────────────────

  # Send a re-engagement message after this many days without a check-in
  silence_threshold: 3

  # ── Post-relapse recovery pulse ──────────

  # Times to send recovery check-ins after a logged relapse
  recovery_pulse_times:
    - "09:00"
    - "21:00"

  # How many days after relapse to continue recovery pulse schedule
  recovery_pulse_days: 3

  # ── Notification fatigue controls ────────

  # No notifications during this window (24h format)
  quiet_hours:
    start: "01:00"
    end: "07:00"

  # How long (in hours) "snooze" defers the next notification
  snooze_duration: 2
